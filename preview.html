<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tmap — App Simulator</title>
<style>
  :root{--bg:#0b0e14;--panel:#11151f;--line:#1c2230;--fg:#d8dee9;--mut:#5c6572;
        --acc:#f5c518;--grn:#2fbf71;--red:#e0525f;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);
       font:13px/1.4 ui-monospace,'SF Mono',Menlo,Consolas,monospace;
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;
         background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{color:var(--acc);font-weight:700;font-size:15px;letter-spacing:.5px}
  select,.btn{background:#1a2130;color:var(--fg);border:1px solid var(--line);
        border-radius:5px;padding:4px 10px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--acc)}
  .btn.live{color:#ff5555;border-color:#5c2a2a}
  .stat{color:var(--mut);font-size:11px;margin-left:auto;text-align:right}
  .stat b{color:var(--grn)}
  main{flex:1;display:flex;min-height:0}
  #left{flex:1;position:relative;min-width:0;background:#0d1119}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  #tip{position:absolute;pointer-events:none;background:#161b26ee;border:1px solid var(--line);
       border-radius:6px;padding:5px 8px;font-size:11px;display:none;z-index:5;white-space:pre}
  aside{width:240px;border-left:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
  aside h3{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;
           padding:8px 10px 4px;border-bottom:1px solid var(--line)}
  .row{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;padding:1px 8px;font-size:11.5px}
  .row .q{text-align:right;color:var(--grn)} .row .p{color:var(--mut);text-align:center}
  .row .s{text-align:left;color:var(--red)}
  #midline{padding:6px 10px;font-size:16px;font-weight:700;text-align:center;
           border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  #tape{flex:1;min-height:110px;overflow-y:auto;padding:4px 8px;font-size:11px}
  .tr{display:flex;justify-content:space-between;padding:1px 0;border-bottom:1px dotted #1a2130}
  .tr.buy{color:var(--grn)} .tr.sell{color:var(--red)}
  footer{display:flex;gap:16px;padding:5px 14px;background:var(--panel);
         border-top:1px solid var(--line);color:var(--mut);font-size:11px;flex-wrap:wrap}
  footer b{color:var(--fg)}
  .sw{color:var(--grn)}
</style>
</head>
<body>
<header>
  <span class="logo">&#9672; Tmap</span>
  <select id="sym"><option>XAUUSD</option><option>EURUSD</option><option>US500</option></select>
  <button class="btn live" id="connect">&#9679; Connect EA Bridge</button>
  <button class="btn" id="rec">&#9654; Start Recording</button>
  <button class="btn" id="speed">&#9193; 4&times;</button>
  <button class="btn" id="reset">&#10227; Reset View</button>
  <span class="stat" id="stat">bridge: <span style="color:var(--red)">offline</span></span>
</header>
<main>
  <div id="left">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
  </div>
  <aside>
    <h3>Order Book L2 (rekonstruksi)</h3>
    <div id="asks"></div>
    <div id="midline">&mdash;</div>
    <div id="bids"></div>
    <h3>Time &amp; Sales</h3>
    <div id="tape"></div>
    <h3>Tile Store</h3>
    <div id="tiles" style="padding:6px 10px;font-size:11px;color:var(--mut)"></div>
  </aside>
</main>
<footer>
  <span><span class="sw">&#9632;</span> bid liquidity &middot; <span style="color:var(--red)">&#9632;</span> ask liquidity</span>
  <span>&#9650;&#9660; agresor trade &middot; garis kuning = mid</span>
  <span>drag=pan &middot; wheel=zoom waktu &middot; ctrl+wheel=zoom harga</span>
  <span>tiles <b id="ntile">0</b> .tmht &middot; frames <b id="nframe">0</b> &middot; ticks <b id="ntick">0</b></span>
</footer>

function draw(){
  ctx.fillStyle='#0d1119'; ctx.fillRect(0,0,W,H);
  const ppx=(H-PAD_T-PAD_B)/view.pw;      // px per $
  const rowH=Math.max(3, D.step*ppx-1);   // grid row height in px
  const fMax=frameIdxAt(playhead>=0?playhead:D.dur);
  // cells — each frame's snapshot persists for its real time span until the
  // next frame (classic L2 heatmap look: continuous horizontal liquidity bands)
  const pxPerT=(W-PAD_L-PAD_R)/(view.t1-view.t0);
  const colPx=Math.max(4,FRAME_DT*pxPerT*0.95);   // width when zoomed way in
  for(let i=0;i<D.x.length;i++){
    const fi=D.x[i]; if(fi>fMax)continue;
    const p=MED+D.y[i]*D.step;
    const tStart=D.ft[fi]-FRAME_DT/2;
    const tEnd=(fi+1<NF)? D.ft[fi+1]-FRAME_DT/2 : D.dur+0.5;
    const cx=xOf(tStart), cw=Math.max(colPx,(tEnd-tStart)*pxPerT-0.5);
    if(cx+cw<0||cx>W)continue;
    const cy=yOf(p)-rowH/2;
    if(cy<-rowH||cy>H)continue;
    const half=Math.max(1.5,cw/2);
    const hb=heat(D.b[i],MAXLOT,'b'), ha=heat(D.a[i],MAXLOT,'a');
    if(hb){ctx.fillStyle=hb;ctx.fillRect(cx,cy,half,rowH);}
    if(ha){ctx.fillStyle=ha;ctx.fillRect(cx+half,cy,half,rowH);}
  }
  // aggressor trades
  for(let i=0;i<D.tt.length;i++){
    if(D.tt[i]>playhead&&recording)continue;
    const x=xOf(D.tt[i]), y=yOf(D.tp[i]);
    if(x<PAD_L||x>W-PAD_R||y<PAD_T||y>H-PAD_B)continue;
    const buy=D.td[i]===1, s=Math.min(7,1.6+Math.sqrt(D.tv[i])*0.7), cx=x;
    ctx.fillStyle=buy?'rgba(55,224,138,.9)':'rgba(255,107,120,.9)';
    ctx.beginPath();
    if(buy){ctx.moveTo(cx,y+s*0.8);ctx.lineTo(cx-s*0.6,y-s*0.4);ctx.lineTo(cx+s*0.6,y-s*0.4);}
    else{ctx.moveTo(cx,y-s*0.8);ctx.lineTo(cx-s*0.6,y+s*0.4);ctx.lineTo(cx+s*0.6,y+s*0.4);}
    ctx.closePath();ctx.fill();
  }
  // mid polyline
  ctx.strokeStyle='rgba(245,197,24,.95)';ctx.lineWidth=1.6;ctx.beginPath();
  for(let fi=0;fi<=fMax;fi++){
    const x=xOf(D.ft[fi]),y=yOf(D.fm[fi]);
    if(fi===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // tile boundaries (dashed)
  ctx.strokeStyle='#39414f';ctx.setLineDash([4,4]);ctx.lineWidth=1;
  for(const tl of D.tiles){
    const x=xOf(tl.start);
    ctx.beginPath();ctx.moveTo(x,PAD_T);ctx.lineTo(x,H-PAD_B);ctx.stroke();
  }
  ctx.setLineDash([]);
  // axes
  ctx.fillStyle='#5c6572';ctx.font='10px ui-monospace,monospace';
  for(let i=0;i<=6;i++){const t=view.t0+i*(view.t1-view.t0)/6;
    ctx.fillText(t.toFixed(0)+'s',xOf(t)-9,H-8);}
  for(let i=0;i<=8;i++){const p=view.pc-view.pw/2+i*view.pw/8;
    ctx.fillText(p.toFixed(2),4,yOf(p)+3);}
  // playhead
  if(recording||playhead<D.dur){
    const x=xOf(playhead);
    ctx.strokeStyle='#f5c518';ctx.lineWidth=1;ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(x,PAD_T);ctx.lineTo(x,H-PAD_B);ctx.stroke();ctx.setLineDash([]);
  }
}

// ---- panels ----
const elAsks=document.getElementById('asks'),elBids=document.getElementById('bids'),
      elMid=document.getElementById('midline'),elTape=document.getElementById('tape');
function domAt(t){
  let lo=0,hi=D.dom.length-1,best=D.dom[0];
  while(lo<=hi){const m=(lo+hi)>>1;if(D.dom[m].t<=t){best=D.dom[m];lo=m+1;}else hi=m-1;}
  return best;
}
function renderPanels(t){
  const d=domAt(t);
  const rows=(list,cls)=>list.slice(0,9).map(([p,q])=>
    '<div class="row"><span class="q">'+(cls==='b'&&q?q.toFixed(2):'')+'</span>'+
    '<span class="p">'+p.toFixed(2)+'</span>'+
    '<span class="s">'+(cls==='a'&&q?q.toFixed(2):'')+'</span></div>').join('');
  elAsks.innerHTML=rows(d.asks.slice().reverse(),'a');
  elBids.innerHTML=rows(d.bids,'b');
  elMid.textContent=d.mid?d.mid.toFixed(2):'—';
  elMid.style.color=d.mid?'#f5c518':'#5c6572';
  const seen=[];
  for(let fi=0;fi<NF;fi++){ if(D.ft[fi]>t)break;
    for(let i=0;i<D.tt.length;i++) if(Math.abs(D.tt[i]-D.ft[fi])<FRAME_DT/2)
      seen.push({t:D.tt[i],p:D.tp[i].toFixed(2),v:D.tv[i],s:D.td[i]});}
  elTape.innerHTML=seen.slice(-13).reverse().map(x=>
    '<div class="tr '+(x.s?'buy':'sell')+'"><span>'+x.t.toFixed(1)+'s</span><span>'+x.p+
    '</span><span>'+x.v.toFixed(2)+' lot</span><span>'+(x.s?'B':'S')+'</span></div>').join('');
  document.getElementById('nframe').textContent=frameIdxAt(t)+1;
  document.getElementById('ntile').textContent=D.tiles.filter(x=>x.start<=t).length;
  document.getElementById('ntick').textContent=Math.round(t/D.dur*9000);
}
document.getElementById('tiles').innerHTML=D.tiles.map(x=>
  'tile '+x.start.toFixed(0)+'–'+x.end.toFixed(0)+'s · <b style="color:#d8dee9">'+x.frames+
  '</b> frames · '+(x.bytes/1024).toFixed(1)+' KB').join('<br>');

// ---- interaction ----
let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.offsetX,y:e.offsetY,t0:view.t0,t1:view.t1,pc:view.pc};});
addEventListener('mouseup',()=>drag=null);
cv.addEventListener('mousemove',e=>{
  if(drag){const dt=(e.offsetX-drag.x)/(W-PAD_L-PAD_R)*(drag.t1-drag.t0);
    view.t0=drag.t0-dt;view.t1=drag.t1-dt;
    view.pc=drag.pc+(e.offsetY-drag.y)/(H-PAD_T-PAD_B)*view.pw;draw();return;}
  const fi=frameIdxAt(tOf(e.offsetX));
  if(tOf(e.offsetX)>=0&&tOf(e.offsetX)<=D.dur&&fi<=frameIdxAt(playhead)){
    tip.style.display='block';tip.style.left=(e.offsetX+14)+'px';tip.style.top=(e.offsetY+10)+'px';
    tip.textContent='t='+D.ft[fi].toFixed(1)+'s\nmid '+D.fm[fi].toFixed(2)+'\np '+pOf(e.offsetY).toFixed(2);
  } else tip.style.display='none';
});
cv.addEventListener('mouseleave',()=>tip.style.display='none');
cv.addEventListener('wheel',e=>{e.preventDefault();
  const k=e.deltaY<0?0.85:1.18;
  if(e.ctrlKey){view.pw*=k;}
  else{const t=tOf(e.offsetX);view.t0=t+(view.t0-t)*k;view.t1=t+(view.t1-t)*k;}
  draw();},{passive:false});
document.getElementById('reset').onclick=()=>{view={...defView,pc:MED};draw();renderPanels(playhead);};

// ---- toolbar sim ----
const statEl=document.getElementById('stat');
document.getElementById('connect').onclick=function(){
  connected=!connected;
  this.textContent=connected?'■ Disconnect':'● Connect EA Bridge';
  statEl.innerHTML=connected?'bridge: <b>online :4712 · XAUUSD tick stream</b>':
    'bridge: <span style="color:#e0525f">offline</span>';
};
const recBtn=document.getElementById('rec');
recBtn.onclick=function(){
  recording=!recording;
  if(recording){playhead=0;lastReal=performance.now();tickLoop();}
  this.textContent=recording?'⏸ Stop Recording':'▶ Start Recording';
};
const spBtn=document.getElementById('speed');
spBtn.onclick=function(){speed=speed===1?4:speed===4?8:1;this.textContent='⏩ '+speed+'×';};
function tickLoop(){
  const now=performance.now();
  if(recording){
    playhead+=(now-lastReal)/1000*speed;
    if(playhead>=D.dur){playhead=D.dur;recording=false;recBtn.textContent='▶ Start Recording';}
    renderPanels(playhead);
    if(view.t1-playhead<4){view.t0=Math.max(-2,playhead-(view.t1-view.t0));view.t1=view.t0+(view.t1-view.t0);}
    draw();
  }
  lastReal=now;
  if(recording)requestAnimationFrame(tickLoop);
}

resize();renderPanels(playhead);draw();
addEventListener('resize',()=>{resize();draw();});
})();
</script>
